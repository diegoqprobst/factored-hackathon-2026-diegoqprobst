name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BANK_SESSION_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false   # a restored uv cache made the interpreter segfault at startup; installs take ~1 s anyway
      - run: uv sync --frozen
      - run: uv run pytest -q
