# The demo runs on Render's free plan, which sleeps after 15 idle minutes and takes ~1 minute to wake.
# Ping it every 10 minutes during the judging window so visitors never meet a cold start.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health and demo endpoints
        run: |
          for path in /health /v1/demo/customers; do
            curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null \
              -w "$path %{http_code} %{time_total}s\n" "https://latam-dispute-agent.onrender.com$path"
          done
